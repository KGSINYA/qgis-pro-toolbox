<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Pro Toolbox — 热插拔式 QGIS 生产提效工具箱">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#081a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7a8"/>
      <stop offset="1" stop-color="#38b2a3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#2f9e8f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9e8f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <circle cx="1090" cy="30" r="130" fill="#6ee7a8" fill-opacity="0.10" filter="url(#soft)"/>

  <g transform="translate(800,74)">
    <rect x="40" y="40" width="300" height="170" rx="18" fill="#0b1524" stroke="#1b2c44" stroke-width="1.5"/>
    <rect x="20" y="20" width="300" height="170" rx="18" fill="#0f1d31" stroke="#24405f" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="170" rx="18" fill="#12233a" stroke="#2f5a86" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="26" rx="8" fill="url(#accent)" fill-opacity="0.9"/>
    <rect x="100" y="16" width="76" height="26" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="184" y="16" width="76" height="26" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="16" y="60" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="16" y="80" width="240" height="8" rx="4" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="16" y="96" width="200" height="8" rx="4" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="16" y="120" width="120" height="30" rx="10" fill="#6ee7a8" fill-opacity="0.16" stroke="#6ee7a8" stroke-opacity="0.45"/>
    <text x="76" y="140" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#9df5c3">ADDON</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="96" font-size="15" letter-spacing="6" fill="#6ee7a8">QGIS · HOT-SWAPPABLE TOOLBOX</text>
    <text x="72" y="172" font-size="64" font-weight="700" fill="#ffffff">Pro Toolbox</text>
    <text x="72" y="218" font-size="24" fill="#b8c7d9">热插拔式 QGIS 生产提效工具箱</text>
    <text x="72" y="258" font-size="16" fill="#7d90a6">防崩自动存档 · 零配置离线依赖 · 高频数字化流自动化 · GPL-3.0</text>
  </g>
</svg>
