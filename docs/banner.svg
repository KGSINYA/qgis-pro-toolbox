<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Pro Toolbox — hot-swappable QGIS production toolbox">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#12352A"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B10"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#1E6823"/>
    </linearGradient>
    <linearGradient id="plusCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <filter id="cardDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-5" dy="8" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>

  <!-- new brand mark: stacked module pack + dashed mount slot + [+] card -->
  <g transform="translate(56, 48) scale(0.477)" filter="url(#softShadow)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>
    <path d="M 76,164 A 28,28 0 0,1 104,136 H 204 C 220,136 228,144 238,158 L 248,172 H 388 A 28,28 0 0,1 416,200 V 400 A 36,36 0 0,1 380,436 H 112 A 36,36 0 0,1 76,400 Z" fill="url(#folderBack)"/>
    <rect x="104" y="180" width="284" height="180" rx="22" fill="#E8F5E9" opacity="0.85"/>
    <rect x="96" y="206" width="300" height="190" rx="24" fill="url(#cardMid)"/>
    <rect x="76" y="236" width="340" height="200" rx="34" fill="url(#folderFront)"/>
    <rect x="112" y="266" width="268" height="140" rx="22" fill="#0D3B10" fill-opacity="0.28" stroke="#A5D6A7" stroke-width="7" stroke-dasharray="18 14" stroke-linecap="round"/>
    <g transform="translate(318, 176) rotate(12)" filter="url(#cardDropShadow)">
      <rect x="-110" y="-82" width="220" height="164" rx="28" fill="url(#plusCard)" stroke="#FFFFFF" stroke-width="8"/>
      <path d="M 0,-36 V 36 M -36,0 H 36" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <text x="326" y="142" font-family="Segoe UI" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">Pro Toolbox</text>
  <text x="328" y="190" font-family="Segoe UI" font-size="25" font-weight="600" fill="#A5D6A7">Hot-Swappable QGIS Production Toolbox</text>
  <text x="328" y="234" font-family="Segoe UI" font-size="18" fill="#CBD5E1">Autosave · Layer switching · Quick input · QA review · Table to points · Word reports</text>
  <text x="328" y="292" font-family="Segoe UI" font-size="16" fill="#94A3B8">GPL-3.0 · QGIS ≥ 3.16 · Zero-config offline wheels · No network, no telemetry</text>
</svg>

